name: Build TrinityCore 5.4.8 (Windows x64)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # 用 v143 工具集编译 vcpkg 依赖 DLL，保证产物在 Win7 SP1 上可加载
      VCPKG_PLATFORM_TOOLSET: v143

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install openssl
          vcpkg install boost-system boost-locale boost-thread boost-serialization boost-filesystem boost-program-options boost-iostreams boost-regex
          vcpkg install boost-asio boost-process boost-property-tree boost-dll boost-dynamic-bitset boost-accumulators boost-stacktrace boost-optional boost-algorithm
          vcpkg install libmariadb
        shell: cmd

      - name: Configure (CMake, Win7-compatible toolset v143)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DCMAKE_SYSTEM_VERSION=10.0.22621.0 ^
            -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /D_WIN32_WINNT=0x0601" ^
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc /GR /D_WIN32_WINNT=0x0601" ^
            -DUSE_MYSQL_SOURCES=0 ^
            -DBoost_USE_STATIC_LIBS=OFF ^
            -DTOOLS=1
        shell: cmd

      - name: Build (Release)
        run: cmake --build build --config Release -- /m /p:ContinueOnError=false /verbosity:minimal
        shell: cmd

      - name: Verify no Win8+ only imports
        run: |
          $files = Get-ChildItem build\bin\Release\*.exe
          $bad = $false
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text.Contains("CreateFile2")) {
              Write-Host "FAIL: $($f.Name) still references CreateFile2 - not Win7 safe"
              $bad = $true
            } else {
              Write-Host "OK: $($f.Name) is Win7 safe"
            }
          }
          if ($bad) { exit 1 }
        shell: pwsh

      - name: Collect binaries
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item build\bin\Release\*.exe output\ -ErrorAction SilentlyContinue
          Copy-Item build\bin\Release\*.dll output\ -ErrorAction SilentlyContinue
          Copy-Item $env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll output\ -ErrorAction SilentlyContinue
          Get-ChildItem output
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc548-server-win64
          path: output/
